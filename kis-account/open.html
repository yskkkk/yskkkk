<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>한국투자 계좌</title>
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    body { font-family: "Noto Sans KR", sans-serif; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
    .msg { padding: 48px 20px; text-align: center; color: #111111; }
    a { color: #1a73e8; }
  </style>
</head>
<body>
  <p class="msg" id="msg">계좌 화면으로 연결 중…</p>
  <iframe id="app" title="한국투자 계좌"></iframe>
  <script>
    const msg = document.getElementById("msg");
    const app = document.getElementById("app");
    let last = "";
    async function fromGithub() {
      const url = "https://raw.githubusercontent.com/yskkkk/yskkkk/main/kis-account/current.json?t=" + Date.now();
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("raw");
      return res.json();
    }
    async function fromApi() {
      const url = "https://api.github.com/repos/yskkkk/yskkkk/contents/kis-account/current.json?t=" + Date.now();
      const res = await fetch(url, { cache: "no-store", headers: { Accept: "application/vnd.github.raw" } });
      if (!res.ok) throw new Error("api");
      return res.json();
    }
    async function pull() {
      let data = null;
      try { data = await fromGithub(); } catch {}
      if (!data || !data.url) {
        try { data = await fromApi(); } catch {}
      }
      const next = String(data && data.url || "").replace(/\/$/, "");
      if (!next) throw new Error("empty");
      if (next === last) return;
      last = next;
      app.src = next;
      app.style.display = "block";
      msg.style.display = "none";
    }
    function tick() {
      pull().catch(() => {
        if (!last) msg.innerHTML = "연결 주소를 아직 못 가져왔습니다. 잠시 후 이 페이지를 새로고침하세요.";
      });
    }
    tick();
    setInterval(tick, 60000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") tick();
    });
  </script>
</body>
</html>
